# Contrato de datos: Tracking de envíos
fuente: tracking_envios
version: 1
ultima_actualizacion: "2026-11-26"
responsable: "logistica_ecommerce (dato provisto por los couriers a través de ElectroCasa)"
llegada: "Azure SQL Database, tabla dbo.TrackingEnvios"
metodo_ingesta: "Conector query-based de SQL Server (Lakeflow Connect)"
connection_unity_catalog: "conn_electrocasa_sqlserver"
cursor: fecha_modificacion
modo_historia: "SCD Type 1: cada evento es inmutable y evento_id es único, así que el merge por llave hace la carga idempotente (si el cursor relee un evento, no se duplica). Append only podría duplicar filas ante una relectura."
frecuencia_esperada: "continua en la fuente; se ingiere en cada corrida del job antes del pipeline"
tabla_bronze: "<catalogo>.bronze.tracking_envios"
tabla_silver: "<catalogo>.silver.tracking_envios"
llave: evento_id
depende_de:
  - fuente: ventas
    columna: venta_id

columnas:
  - nombre: evento_id
    tipo: "bigint"
    nulo: false
  - nombre: tracking_id
    tipo: "string"
    nulo: false
  - nombre: venta_id
    tipo: "string"
    nulo: true
    regla: "si no existe en ventas el evento se conserva (warn venta_existe): P6 mide el desempeño del courier y no depende de la venta"
  - nombre: courier
    tipo: "string"
    nulo: false
  - nombre: estado_entrega
    tipo: "string"
    nulo: false
    valores_permitidos: ["pendiente", "en_transito", "entregado", "devuelto"]
  - nombre: sucursal_origen
    tipo: "string"
    nulo: true
  - nombre: fecha_actualizacion
    tipo: "date"
    nulo: true
  - nombre: fecha_modificacion
    tipo: "timestamp"
    nulo: false

reglas_de_calidad:
  - nombre: estado_conocido
    condicion: "estado_entrega IN ('pendiente','en_transito','entregado','devuelto')"
    politica: "drop"
    destino_rechazos: "<catalogo>.silver.cuarentena"
    justificacion: "Un estado que no se pudo mapear no se puede usar para tiempos ni % de devueltos (P6)."
  - nombre: venta_existe
    condicion: "venta_existe"
    politica: "warn"
    destino_rechazos: "<catalogo>.silver.cuarentena"
    justificacion: "El envío existió físicamente; no afecta P6."
  - nombre: evento_id_no_nulo
    condicion: "evento_id IS NOT NULL"
    politica: "drop"
    destino_rechazos: "<catalogo>.silver.cuarentena"
    justificacion: "Llave del conector."
  - nombre: tracking_id_no_nulo
    condicion: "tracking_id IS NOT NULL"
    politica: "drop"
    destino_rechazos: "<catalogo>.silver.cuarentena"
    justificacion: "Sin envío no se agregan eventos."
  - nombre: fecha_modificacion_no_nula
    condicion: "fecha_modificacion IS NOT NULL"
    politica: "drop"
    destino_rechazos: "<catalogo>.silver.cuarentena"
    justificacion: "Es la marca de tiempo usada en P6."

transformaciones_silver:
  - "estado_entrega: 'En camino', 'EN_CAMINO', 'en_transito'... -> pendiente/en_transito/entregado/devuelto"
  - "courier: minúsculas, guiones -> espacio, initcap"
  - "eliminación de mensajes reprocesados: mismo tracking_id y mismo estado con distinto evento_id -> se queda el primero por fecha_modificacion"
  - "fecha_actualizacion a DATE (se conserva nula), fecha_modificacion a TIMESTAMP"

problemas_conocidos:
  - problema: "estado_entrega con valores y casing inconsistentes"
    ejemplo: "En camino / EN_CAMINO / en_transito"
    filas_afectadas: "completar tras explorar bronze.tracking_envios (SELECT estado_entrega, COUNT(*) ... GROUP BY 1)"
    tratamiento: "mapeo a 4 estados"
  - problema: "courier con casing inconsistente"
    ejemplo: "OLVA / olva"
    filas_afectadas: "completar tras explorar bronze.tracking_envios"
    tratamiento: "initcap"
  - problema: "mensajes reprocesados"
    ejemplo: "mismo tracking_id y estado con dos evento_id"
    filas_afectadas: "completar: filas bronze - filas silver"
    tratamiento: "deduplicación por tracking_id + estado"
  - problema: "fecha_actualizacion nula"
    ejemplo: "NULL"
    filas_afectadas: "completar"
    tratamiento: "se conserva; P6 usa fecha_modificacion"
  - problema: "venta_id inexistente en ventas"
    ejemplo: "VTA sin venta"
    filas_afectadas: "completar (ver cuarentena regla venta_existe)"
    tratamiento: "warn"
